<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> טיול מונטנגרו 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-turquoise: #00CED1;
            --primary-green: #228B22;
            --soft-turquoise: #E0F7F9;
            --dark-teal: #006D77;
            --text-main: #333333;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f0f4f4;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-turquoise);
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .main-title {
            color: var(--dark-teal); 
            font-size: 26px; 
            margin: 0;
        }

        .greeting-card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid #eee;
            border-top: 6px solid var(--primary-green);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: auto; /* Push footer down */
        }

        .greeting-card h2 {
            color: var(--primary-turquoise);
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .greeting-card p {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }

        .feedback-box {
            background-color: var(--soft-turquoise);
            padding: 25px 20px;
            border-radius: 12px;
            border: 1px solid #b2ebf2;
        }

        .feedback-box h3 {
            margin-top: 0;
            color: var(--dark-teal);
            font-size: 18px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: 'Assistant', sans-serif;
            resize: vertical;
            margin-bottom: 15px;
            font-size: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-turquoise);
            box-shadow: 0 0 5px rgba(0, 206, 209, 0.3);
        }

        .btn-submit {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Assistant', sans-serif;
            box-shadow: 0 4px 10px rgba(34, 139, 34, 0.2);
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            padding: 30px 15px 15px 15px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }

        .footer strong {
            color: var(--dark-teal);
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header">
        <img src="1.jpg" alt="Logo" class="logo" onerror="if (this.src != '1.JPG') this.src = '1.JPG';">
        <h1 class="main-title">טיול זוגי שמואלי מונטנגרו | יוני 2026</h1>
    </div>

    <div class="greeting-card">
        <h2>איזה כיף שנהניתם!</h2>
        <p>נתראה בטיול הבא,<br><strong>הדס</strong></p>

        <div class="feedback-box">
            <h3><i class="fa-solid fa-heart" style="color: #ff4d4d;"></i> נשמח לשמוע איך היה</h3>
            <textarea id="feedbackText" rows="5" placeholder="שתפו אותנו בחוויות שלכם מהטיול..."></textarea>
            <button onclick="sendFeedback()" class="btn-submit">
                <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i>
                שליחת חוות דעת
            </button>
        </div>
    </div>

    <div class="footer">
        <strong>כל הזכויות שמורות להדס טרכטר - יועצת טיולים בארץ ובעולם 050-5685356</strong>
        אין להעביר ללא אישור מפורש. העובר על כך עובר על גזל לפי דין תורה וחוקי המקום.
    </div>

</div>

<script>
    function sendFeedback() {
        var text = document.getElementById('feedbackText').value;
        if(text.trim() === "") {
            alert('אנא כתבו משהו לפני השליחה 😊');
            return;
        }
        
        // הטקסט שישלח לוואטסאפ של הדס
        var message = "היי הדס, חזרנו ממונטנגרו ורצינו לשתף: \n\n" + text;
        var encodedMessage = encodeURIComponent(message);
        
        // הפניה לוואטסאפ (המספר של הדס מהחותמת: 0505685356 -> 972505685356)
        window.open("https://wa.me/972505685356?text=" + encodedMessage, "_blank");
        
        // הודעת תודה למשתמש
        document.getElementById('feedbackText').value = "";
        alert('תודה רבה! המערכת מעבירה אתכם לשליחת ההודעה בוואטסאפ.');
    }
</script>

</body>
</html>
